<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PdfPreview 插件演示</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }
      #app {
        position: fixed;
        inset: 48px 0 0 0;
      }
      .demo-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        background: #ffffff;
        color: #202124;
        border-bottom: 1px solid #dadce0;
        box-shadow: 0 1px 2px rgb(60 64 67 / 15%);
        z-index: 1000;
      }
      .demo-bar h1 {
        font-size: 14px;
        font-weight: 500;
        color: #5f6368;
        margin: 0 8px 0 0;
        white-space: nowrap;
      }
      .demo-bar button {
        height: 32px;
        padding: 0 16px;
        border: none;
        border-radius: 999px;
        background: #1a73e8;
        color: #ffffff;
        cursor: pointer;
        font-weight: 500;
        transition: background-color 0.15s ease;
      }
      .demo-bar button:hover {
        background: #1765cc;
      }
      .demo-bar .hint {
        color: #5f6368;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #fileInput {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <h1>PdfPreview</h1>
      <div id="urlSlot"></div>
      <button id="openBtn">打开本地 PDF</button>
      <input id="fileInput" type="file" accept="application/pdf,.pdf" />
      <span class="hint" id="hint"></span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
